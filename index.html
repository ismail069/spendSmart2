<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>SpendSmart</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--p:#2563eb;--p2:#1d4ed8;--card:#fff;--muted:#6b7280;--line:#e5e9f1;--soft:#eef4ff;--danger:#dc2626;--shadow:0 12px 35px #25334f12}
    [data-theme=dark]{color:#eef2ff;background:#0c111c;--card:#151c29;--muted:#98a2b7;--line:#293346;--soft:#172a51;--shadow:0 15px 38px #0004;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:inherit}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}
    header{height:68px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1120px)/2));background:color-mix(in srgb,var(--card) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}.logo{width:38px;height:38px;display:grid;place-items:center;color:#fff;background:var(--p);border-radius:12px 12px 12px 4px}.brand b{color:var(--p)}.head-actions,.actions{display:flex;align-items:center;gap:8px}
    button{border:0}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:var(--card)}.langs{display:flex;padding:3px;background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:10px}.langs button{padding:6px 8px;color:var(--muted);background:transparent;border-radius:7px;font-size:12px;font-weight:800}.langs button.on{color:var(--p);background:var(--card)}
    .btn{min-height:42px;padding:0 16px;border-radius:11px;font-weight:700}.primary{color:#fff;background:var(--p);box-shadow:0 7px 18px #2563eb33}.secondary{color:inherit;background:var(--card);border:1px solid var(--line)}.danger{color:#fff;background:var(--danger)}
    main{max-width:1120px;margin:auto;padding:40px 16px 90px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{margin:0 0 5px;color:var(--p);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.hero h1{margin:0;font-size:38px;letter-spacing:-1.5px}.hero h1 b{color:var(--p)}.hero p:last-child{margin:7px 0 0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:18px}.stat small{display:block;margin-bottom:6px;color:var(--muted);font-weight:600}.stat strong{display:block;overflow:hidden;font-size:20px;text-overflow:ellipsis;white-space:nowrap}.stat em{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-style:normal}
    .budget{margin-bottom:17px;padding:21px 23px;color:#fff;background:linear-gradient(125deg,#1d4ed8,#2563eb 65%,#3b82f6);border-radius:18px;box-shadow:0 14px 30px #2563eb33}.budget.warn{background:linear-gradient(125deg,#b45309,#f59e0b)}.budget.over{background:linear-gradient(125deg,#b91c1c,#ef4444)}.budget-top,.budget-meta,.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.budget h3{margin:0;font-size:22px}.budget h3 span{margin-left:6px;font-size:12px;font-weight:500;opacity:.75}.budget button{color:#fff;background:transparent;text-decoration:underline}.track{height:7px;margin:17px 0 8px;background:#ffffff38;border-radius:10px;overflow:hidden}.track i{display:block;height:100%;background:#fff;border-radius:10px}.budget-meta{font-size:11px;opacity:.8}.warning{padding-top:10px;margin-top:10px;border-top:1px solid #ffffff38;font-size:12px;font-weight:700}
    .filters{display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px;padding:10px;margin-bottom:17px;background:var(--card);border:1px solid var(--line);border-radius:14px}.filters input,.filters select{height:38px;padding:0 10px;color:inherit;background:color-mix(in srgb,var(--muted) 9%,transparent);border:0;border-radius:9px;outline:0}.filters input:focus,.filters select:focus,.field input:focus,.field select:focus{box-shadow:0 0 0 2px var(--p)}
    .layout{display:grid;grid-template-columns:1.6fr .8fr;gap:17px;align-items:start}.panel{padding:21px}.section-head{margin-bottom:13px}.section-head h2{margin:0;font-size:18px}.link{padding:0;color:var(--p);background:transparent;font-weight:700}.expense{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:13px 2px;border-top:1px solid var(--line)}.expense:first-child{border:0}.cat-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:18px}.expense-row{display:flex;justify-content:space-between;gap:10px}.expense h4{margin:0 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.expense strong{white-space:nowrap}.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:10px}.badge{padding:3px 7px;border-radius:10px;font-weight:800}.item-actions{display:flex}.item-actions button{width:30px;height:30px;color:var(--muted);background:transparent;border-radius:7px}.item-actions button:hover{background:var(--soft);color:var(--p)}.item-actions .del:hover{color:var(--danger)}
    .empty{min-height:290px;display:grid;place-content:center;justify-items:center;padding:25px;text-align:center}.empty .big{width:65px;height:65px;display:grid;place-items:center;margin-bottom:12px;color:var(--p);background:var(--soft);border-radius:20px;font-size:28px}.empty h3{margin:0 0 6px}.empty p{max-width:310px;margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.5}
    .donut{width:155px;height:155px;display:grid;place-items:center;margin:22px auto;border-radius:50%;background:var(--line)}.donut div{width:101px;height:101px;display:grid;place-content:center;padding:8px;background:var(--card);border-radius:50%;text-align:center}.donut small{color:var(--muted)}.legend{display:grid;gap:11px}.legend-row{display:grid;grid-template-columns:8px 1fr auto 32px;align-items:center;gap:8px;font-size:11px}.dot{width:8px;height:8px;border-radius:3px}.legend-row span:last-child{color:var(--muted);text-align:right}.average{padding:6px 9px;color:var(--p);background:var(--soft);border-radius:9px;font-size:11px;font-weight:800}
    .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:#09101c99;backdrop-filter:blur(4px)}.modal{width:min(100%,530px);max-height:94vh;overflow:auto;padding:23px;background:var(--card);border-radius:20px;box-shadow:0 25px 70px #0006}.modal.small{max-width:420px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal h2{margin:0;font-size:21px}.form{display:grid;gap:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:800}.field input,.field select{width:100%;height:44px;padding:0 11px;color:inherit;background:color-mix(in srgb,var(--muted) 9%,transparent);border:1px solid transparent;border-radius:10px;outline:0}.field .err{color:var(--danger);font-size:11px}.modal-actions{display:flex;justify-content:end;gap:8px;margin-top:8px}.confirm-copy{color:var(--muted);line-height:1.5}.toast{position:fixed;z-index:200;bottom:24px;left:50%;padding:11px 16px;color:#fff;background:#172033;border-radius:11px;transform:translateX(-50%);box-shadow:0 10px 30px #0004}.fab{display:none}
    @media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}
    @media(max-width:600px){header{height:62px}.brand span{font-size:17px}.desktop{display:none}.langs button{padding:5px 6px}main{padding:25px 13px 88px}.hero h1{font-size:29px}.hero .actions{display:none}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:16px}.budget{padding:18px}.budget h3{font-size:18px}.budget h3 span{display:block;margin:3px 0}.filters{grid-template-columns:1fr}.filters input:first-child{grid-column:auto}.panel{padding:17px 13px}.expense{grid-template-columns:39px 1fr auto}.item-actions{flex-direction:column}.grid2{grid-template-columns:1fr}.overlay{align-items:end;padding:0}.modal{width:100%;padding:20px 17px 24px;border-radius:22px 22px 0 0}.modal-actions .btn{flex:1}.fab{position:fixed;right:17px;bottom:18px;z-index:30;display:grid;place-items:center;width:56px;height:56px;color:#fff;background:var(--p);border-radius:18px 18px 18px 6px;box-shadow:0 12px 28px #2563eb66;font-size:27px}.toast{bottom:85px;white-space:nowrap}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">◫</div><span>Spend<b>Smart</b></span></div>
    <div class="head-actions">
      <button class="icon" id="themeBtn" title="Theme">☾</button>
      <div class="langs"><button data-lang="en">EN</button><button data-lang="id">ID</button></div>
      <button class="icon" id="resetBtn" title="Reset data">⋮</button>
      <button class="btn primary desktop" id="headAdd">＋ <span data-t="add">Add expense</span></button>
    </div>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow" id="todayLabel"></p><h1><span data-t="greeting">Good to see you</span><b>.</b></h1><p data-t="subtitle">Here’s where your money went.</p></div>
      <div class="actions"><button class="btn secondary" id="exportBtn">⇩ <span data-t="export">Export CSV</span></button><button class="btn primary" id="heroAdd">＋ <span data-t="add">Add expense</span></button></div>
    </section>
    <section class="stats">
      <div class="card stat"><small data-t="spentToday">Spent today</small><strong id="todayTotal">Rp0</strong></div>
      <div class="card stat"><small data-t="thisMonth">This month</small><strong id="monthTotal">Rp0</strong></div>
      <div class="card stat"><small data-t="topCategory">Top category</small><strong id="topCategory">—</strong><em id="topAmount"></em></div>
      <div class="card stat"><small data-t="transactions">Transactions</small><strong id="transactionCount">0</strong></div>
    </section>
    <section class="budget" id="budgetCard"></section>
    <section class="filters">
      <input id="search" data-ph="search" placeholder="Search expenses...">
      <select id="categoryFilter"></select>
      <select id="paymentFilter"></select>
      <input id="dateFilter" type="date">
    </section>
    <div class="layout">
      <section class="panel">
        <div class="section-head"><div><p class="eyebrow" data-t="transactions">Transactions</p><h2 data-t="recent">Recent expenses</h2></div><button class="link" id="clearFilters" data-t="clear">Clear filters</button></div>
        <div id="expenseList"></div>
      </section>
      <section class="panel">
        <div class="section-head"><div><p class="eyebrow" data-t="thisMonth">This month</p><h2 data-t="summary">Spending by category</h2></div><div class="average"><span data-t="average">Daily average</span>: <b id="average"></b></div></div>
        <div id="chart"></div>
      </section>
    </div>
  </main>
  <button class="fab" id="fab">＋</button>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hide"></div>
  <script>
  (() => {
    const CATS=["Food","Transport","Shopping","Bills","Health","Entertainment","Education","Other"];
    const PAYS=["Cash","Debit Card","Credit Card","E-Wallet","Bank Transfer"];
    const COLORS={Food:"#f97316",Transport:"#06b6d4",Shopping:"#ec4899",Bills:"#8b5cf6",Health:"#10b981",Entertainment:"#f59e0b",Education:"#3b82f6",Other:"#64748b"};
    const ICONS={Food:"🍜",Transport:"🚕",Shopping:"🛍",Bills:"▤",Health:"✚",Entertainment:"▶",Education:"▥",Other:"•••"};
    const I={
      en:{greeting:"Good to see you",subtitle:"Here’s where your money went.",add:"Add expense",edit:"Edit expense",spentToday:"Spent today",thisMonth:"This month",topCategory:"Top category",transactions:"Transactions",recent:"Recent expenses",summary:"Spending by category",average:"Daily average",export:"Export CSV",search:"Search expenses...",allCats:"All categories",allPays:"All payment methods",clear:"Clear filters",monthlyBudget:"Monthly budget",setBudget:"Set budget",editBudget:"Edit budget",left:"left to spend",over:"over budget",used:"used",almost:"You’re close to your monthly limit.",exceeded:"Budget exceeded.",amount:"Amount",category:"Category",description:"Description or note",descPh:"e.g. Lunch with friends",date:"Date",payment:"Payment method",save:"Save expense",update:"Update expense",cancel:"Cancel",required:"This field is required.",amountErr:"Enter an amount greater than zero.",future:"Date cannot be in the future.",empty:"No expenses yet",emptyBody:"Add your first expense and start seeing where your money goes.",noMatch:"No matching expenses",noMatchBody:"Try changing your search or filters.",noSpending:"No spending recorded this month.",deleteTitle:"Delete this expense?",deleteBody:"This action cannot be undone.",delete:"Delete",budgetTitle:"Set monthly budget",saveBudget:"Save budget",reset:"Reset all data",resetTitle:"Reset all data?",resetBody:"This permanently deletes every expense and your monthly budget.",confirmReset:"Yes, reset",of:"of",added:"Expense added",updated:"Expense updated",deleted:"Expense deleted",budgetSaved:"Budget saved",resetDone:"All data reset",nothingExport:"Add an expense before exporting."},
      id:{greeting:"Senang bertemu lagi",subtitle:"Lihat ke mana uangmu pergi.",add:"Tambah pengeluaran",edit:"Ubah pengeluaran",spentToday:"Keluar hari ini",thisMonth:"Bulan ini",topCategory:"Kategori terbesar",transactions:"Transaksi",recent:"Pengeluaran terbaru",summary:"Pengeluaran per kategori",average:"Rata-rata harian",export:"Ekspor CSV",search:"Cari pengeluaran...",allCats:"Semua kategori",allPays:"Semua metode",clear:"Hapus filter",monthlyBudget:"Anggaran bulanan",setBudget:"Atur anggaran",editBudget:"Ubah anggaran",left:"tersisa",over:"melebihi anggaran",used:"terpakai",almost:"Kamu hampir mencapai batas bulanan.",exceeded:"Anggaran terlampaui.",amount:"Jumlah",category:"Kategori",description:"Deskripsi atau catatan",descPh:"mis. Makan siang bersama teman",date:"Tanggal",payment:"Metode pembayaran",save:"Simpan pengeluaran",update:"Perbarui pengeluaran",cancel:"Batal",required:"Kolom ini wajib diisi.",amountErr:"Masukkan jumlah lebih dari nol.",future:"Tanggal tidak boleh di masa depan.",empty:"Belum ada pengeluaran",emptyBody:"Tambahkan pengeluaran pertama dan mulai pantau uangmu.",noMatch:"Pengeluaran tidak ditemukan",noMatchBody:"Coba ubah pencarian atau filter.",noSpending:"Belum ada pengeluaran bulan ini.",deleteTitle:"Hapus pengeluaran ini?",deleteBody:"Tindakan ini tidak dapat dibatalkan.",delete:"Hapus",budgetTitle:"Atur anggaran bulanan",saveBudget:"Simpan anggaran",reset:"Hapus semua data",resetTitle:"Hapus semua data?",resetBody:"Semua pengeluaran dan anggaran bulanan akan dihapus permanen.",confirmReset:"Ya, hapus",of:"dari",added:"Pengeluaran ditambahkan",updated:"Pengeluaran diperbarui",deleted:"Pengeluaran dihapus",budgetSaved:"Anggaran disimpan",resetDone:"Semua data dihapus",nothingExport:"Tambahkan pengeluaran sebelum mengekspor."}
    };
    const CN={en:Object.fromEntries(CATS.map(x=>[x,x])),id:{Food:"Makanan",Transport:"Transportasi",Shopping:"Belanja",Bills:"Tagihan",Health:"Kesehatan",Entertainment:"Hiburan",Education:"Pendidikan",Other:"Lainnya"}};
    const PN={en:Object.fromEntries(PAYS.map(x=>[x,x])),id:{Cash:"Tunai","Debit Card":"Kartu Debit","Credit Card":"Kartu Kredit","E-Wallet":"Dompet Digital","Bank Transfer":"Transfer Bank"}};
    const get=(k,d)=>{try{const v=localStorage.getItem("ss."+k);return v===null?d:JSON.parse(v)}catch{return d}};
    const put=(k,v)=>{try{localStorage.setItem("ss."+k,JSON.stringify(v))}catch{}};
    let expenses=get("expenses",[]),budget=get("budget",0),lang=get("language","en"),theme=get("theme","light"),editing=null;
    const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),t=()=>I[lang];
    const localDate=()=>{const d=new Date(),o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)};
    const money=(n,compact=false)=>new Intl.NumberFormat(lang==="id"?"id-ID":"en-US",{style:"currency",currency:"IDR",maximumFractionDigits:0,notation:compact&&Math.abs(n)>=1e6?"compact":"standard"}).format(n);
    const date=v=>new Intl.DateTimeFormat(lang==="id"?"id-ID":"en-US",{day:"numeric",month:"short",year:"numeric"}).format(new Date(v+"T00:00:00"));
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
    function toast(msg){const e=$("#toast");e.textContent="✓ "+msg;e.classList.remove("hide");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add("hide"),2200)}
    function translate(){
      document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;
      $$("[data-t]").forEach(e=>e.textContent=t()[e.dataset.t]);$$("[data-ph]").forEach(e=>e.placeholder=t()[e.dataset.ph]);
      $$("[data-lang]").forEach(e=>e.classList.toggle("on",e.dataset.lang===lang));
      $("#themeBtn").textContent=theme==="dark"?"☀":"☾";
      $("#todayLabel").textContent=new Intl.DateTimeFormat(lang==="id"?"id-ID":"en-US",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
      fillFilters();
    }
    function fillFilters(){
      const cf=$("#categoryFilter"),pf=$("#paymentFilter"),cv=cf.value,pv=pf.value;
      cf.innerHTML=`<option value="">${t().allCats}</option>`+CATS.map(x=>`<option value="${x}">${CN[lang][x]}</option>`).join("");
      pf.innerHTML=`<option value="">${t().allPays}</option>`+PAYS.map(x=>`<option value="${x}">${PN[lang][x]}</option>`).join("");
      cf.value=cv;pf.value=pv;
    }
    function calculate(){
      const today=localDate(),month=today.slice(0,7),current=expenses.filter(x=>x.date.startsWith(month));
      const totals=Object.fromEntries(CATS.map(c=>[c,current.filter(x=>x.category===c).reduce((s,x)=>s+x.amount,0)]));
      const monthTotal=current.reduce((s,x)=>s+x.amount,0),top=Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
      return{todayTotal:expenses.filter(x=>x.date===today).reduce((s,x)=>s+x.amount,0),monthTotal,count:current.length,totals,top:top&&top[1]?top:null,average:monthTotal/new Date().getDate()};
    }
    function render(){
      translate();const s=calculate();
      $("#todayTotal").textContent=money(s.todayTotal,true);$("#monthTotal").textContent=money(s.monthTotal,true);$("#transactionCount").textContent=s.count;
      $("#topCategory").textContent=s.top?CN[lang][s.top[0]]:"—";$("#topAmount").textContent=s.top?money(s.top[1],true):"";
      renderBudget(s.monthTotal);renderExpenses();renderChart(s);put("expenses",expenses);put("budget",budget);put("language",lang);put("theme",theme);
    }
    function renderBudget(spent){
      const e=$("#budgetCard");
      if(!budget){e.className="budget";e.innerHTML=`<div class="budget-top"><div><p class="eyebrow" style="color:#ffffffaa">${t().monthlyBudget}</p><h3>${t().setBudget}</h3></div><button class="btn secondary" id="budgetBtn">${t().setBudget}</button></div>`;$("#budgetBtn").onclick=openBudget;return}
      const pct=spent/budget*100,remaining=budget-spent,status=pct>=100?"over":pct>=80?"warn":"";
      e.className="budget "+status;e.innerHTML=`<div class="budget-top"><div><p class="eyebrow" style="color:#ffffffaa">${t().monthlyBudget}</p><h3>${money(Math.abs(remaining))}<span>${remaining>=0?t().left:t().over}</span></h3></div><button id="budgetBtn">${t().editBudget}</button></div><div class="track"><i style="width:${Math.min(pct,100)}%"></i></div><div class="budget-meta"><span>${money(spent)} ${t().of} ${money(budget)}</span><b>${Math.round(pct)}% ${t().used}</b></div>${status?`<div class="warning">! ${status==="over"?t().exceeded:t().almost}</div>`:""}`;
      $("#budgetBtn").onclick=openBudget;
    }
    function filtered(){
      const q=$("#search").value.toLowerCase(),c=$("#categoryFilter").value,p=$("#paymentFilter").value,d=$("#dateFilter").value;
      return expenses.filter(x=>(!q||x.description.toLowerCase().includes(q))&&(!c||x.category===c)&&(!p||x.payment===p)&&(!d||x.date===d)).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||"").localeCompare(a.createdAt||""));
    }
    function renderExpenses(){
      const list=filtered(),active=$("#search").value||$("#categoryFilter").value||$("#paymentFilter").value||$("#dateFilter").value,e=$("#expenseList");
      if(!list.length){e.innerHTML=`<div class="empty"><div class="big">${active?"⌕":"▤"}</div><h3>${active?t().noMatch:t().empty}</h3><p>${active?t().noMatchBody:t().emptyBody}</p>${active?"":`<button class="btn primary" id="emptyAdd">＋ ${t().add}</button>`}</div>`;if(!active)$("#emptyAdd").onclick=()=>openExpense();return}
      e.innerHTML=list.map(x=>`<article class="expense"><div class="cat-icon" style="background:${COLORS[x.category]}18">${ICONS[x.category]}</div><div><div class="expense-row"><h4>${esc(x.description)}</h4><strong>-${money(x.amount)}</strong></div><div class="meta"><span class="badge" style="color:${COLORS[x.category]};background:${COLORS[x.category]}18">${CN[lang][x.category]}</span><span>${PN[lang][x.payment]}</span><span>•</span><span>${date(x.date)}</span></div></div><div class="item-actions"><button data-edit="${x.id}" title="${t().edit}">✎</button><button class="del" data-delete="${x.id}" title="${t().delete}">⌫</button></div></article>`).join("");
      $$("[data-edit]").forEach(b=>b.onclick=()=>openExpense(expenses.find(x=>x.id===b.dataset.edit)));$$("[data-delete]").forEach(b=>b.onclick=()=>confirmDelete(b.dataset.delete));
    }
    function renderChart(s){
      $("#average").textContent=money(s.average,true);const items=Object.entries(s.totals).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]),e=$("#chart");
      if(!items.length){e.innerHTML=`<div class="empty" style="min-height:240px"><div class="donut"><div><b>0</b></div></div><p>${t().noSpending}</p></div>`;return}
      let at=0;const stops=items.map(([c,v])=>{const start=at;at+=v/s.monthTotal*100;return`${COLORS[c]} ${start}% ${at}%`}).join(",");
      e.innerHTML=`<div class="donut" style="background:conic-gradient(${stops})"><div><small>${t().thisMonth}</small><b>${money(s.monthTotal,true)}</b></div></div><div class="legend">${items.map(([c,v])=>`<div class="legend-row"><i class="dot" style="background:${COLORS[c]}"></i><span>${CN[lang][c]}</span><b>${money(v,true)}</b><span>${Math.round(v/s.monthTotal*100)}%</span></div>`).join("")}</div>`;
    }
    function modal(html,small=false){$("#modalRoot").innerHTML=`<div class="overlay"><div class="modal ${small?"small":""}">${html}</div></div>`;$(".overlay").onclick=e=>{if(e.target===e.currentTarget)closeModal()};$$("[data-close]").forEach(x=>x.onclick=closeModal)}
    function closeModal(){editing=null;$("#modalRoot").innerHTML=""}
    function openExpense(item=null){
      editing=item;modal(`<div class="modal-head"><h2>${item?t().edit:t().add}</h2><button class="icon" data-close>×</button></div><form class="form" id="expenseForm">
        <div class="field"><label>${t().amount}</label><input name="amount" type="number" min="0" step="1000" inputmode="numeric" value="${item?item.amount:""}" placeholder="0" autofocus><small class="err"></small></div>
        <div class="field"><label>${t().description}</label><input name="description" value="${item?esc(item.description):""}" placeholder="${t().descPh}"><small class="err"></small></div>
        <div class="grid2"><div class="field"><label>${t().category}</label><select name="category"><option value="">—</option>${CATS.map(x=>`<option value="${x}" ${item&&item.category===x?"selected":""}>${CN[lang][x]}</option>`).join("")}</select><small class="err"></small></div><div class="field"><label>${t().payment}</label><select name="payment"><option value="">—</option>${PAYS.map(x=>`<option value="${x}" ${item&&item.payment===x?"selected":""}>${PN[lang][x]}</option>`).join("")}</select><small class="err"></small></div></div>
        <div class="field"><label>${t().date}</label><input name="date" type="date" max="${localDate()}" value="${item?item.date:localDate()}"><small class="err"></small></div>
        <div class="modal-actions"><button type="button" class="btn secondary" data-close>${t().cancel}</button><button class="btn primary">${item?t().update:t().save}</button></div></form>`);
      $("#expenseForm").onsubmit=saveExpense;
    }
    function saveExpense(ev){
      ev.preventDefault();const f=new FormData(ev.target),v=Object.fromEntries(f),fields=[...ev.target.querySelectorAll(".field")];fields.forEach(x=>x.querySelector(".err").textContent="");let bad=false;
      const err=(name,msg)=>{ev.target.elements[name].closest(".field").querySelector(".err").textContent=msg;bad=true};
      if(!v.amount||+v.amount<=0)err("amount",t().amountErr);if(!v.description.trim())err("description",t().required);if(!v.category)err("category",t().required);if(!v.payment)err("payment",t().required);if(!v.date)err("date",t().required);else if(v.date>localDate())err("date",t().future);if(bad)return;
      const row={id:editing?.id||uid(),amount:+v.amount,description:v.description.trim(),category:v.category,payment:v.payment,date:v.date,createdAt:editing?.createdAt||new Date().toISOString()};
      if(editing){expenses=expenses.map(x=>x.id===row.id?row:x);toast(t().updated)}else{expenses.unshift(row);toast(t().added)}closeModal();render();
    }
    function openBudget(){modal(`<div class="modal-head"><h2>${t().budgetTitle}</h2><button class="icon" data-close>×</button></div><form class="form" id="budgetForm"><div class="field"><label>${t().monthlyBudget}</label><input name="budget" type="number" min="0" step="100000" inputmode="numeric" value="${budget||""}" placeholder="0" autofocus><small class="err"></small></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>${t().cancel}</button><button class="btn primary">${t().saveBudget}</button></div></form>`,true);$("#budgetForm").onsubmit=e=>{e.preventDefault();const v=+new FormData(e.target).get("budget");if(v<=0){e.target.querySelector(".err").textContent=t().amountErr;return}budget=v;closeModal();render();toast(t().budgetSaved)}}
    function confirmDelete(id){modal(`<div class="modal-head"><h2>${t().deleteTitle}</h2><button class="icon" data-close>×</button></div><p class="confirm-copy">${t().deleteBody}</p><div class="modal-actions"><button class="btn secondary" data-close>${t().cancel}</button><button class="btn danger" id="confirmDelete">${t().delete}</button></div>`,true);$("#confirmDelete").onclick=()=>{expenses=expenses.filter(x=>x.id!==id);closeModal();render();toast(t().deleted)}}
    function exportCsv(){if(!expenses.length){toast(t().nothingExport);return}const q=v=>`"${String(v).replaceAll('"','""')}"`,rows=[["Date","Description","Category","Payment Method","Amount"],...expenses.map(x=>[x.date,x.description,x.category,x.payment,x.amount])],blob=new Blob(["\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="spendsmart-"+localDate()+".csv";a.click();URL.revokeObjectURL(url)}
    function resetConfirm(){modal(`<div class="modal-head"><h2>${t().resetTitle}</h2><button class="icon" data-close>×</button></div><p class="confirm-copy">${t().resetBody}</p><div class="modal-actions"><button class="btn secondary" data-close>${t().cancel}</button><button class="btn danger" id="confirmReset">${t().confirmReset}</button></div>`,true);$("#confirmReset").onclick=()=>{expenses=[];budget=0;closeModal();render();toast(t().resetDone)}}
    ["headAdd","heroAdd","fab"].forEach(id=>$("#"+id).onclick=()=>openExpense());$("#exportBtn").onclick=exportCsv;
    $("#themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";render()};$$("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
    ["search","categoryFilter","paymentFilter","dateFilter"].forEach(id=>$("#"+id).oninput=renderExpenses);
    $("#clearFilters").onclick=()=>{$("#search").value="";$("#categoryFilter").value="";$("#paymentFilter").value="";$("#dateFilter").value="";renderExpenses()};
    $("#resetBtn").onclick=resetConfirm;
    render();
  })();
  </script>
</body>
</html>
